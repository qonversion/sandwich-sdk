name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2
      - name: Validation
        run: |
          pod lib lint --allow-warnings

  spm:
    name: SPM (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['iOS Simulator', 'macOS']

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v4
      # `swift build` compiles only the host (macOS) slice and skips the iOS-only No-Codes bridge;
      # xcodebuild against the package (the xcodeproj lives under ios/, so the repo root resolves as a package)
      # builds the slices SPM consumers actually get.
      - name: SPM build (${{ matrix.platform }})
        run: |
          xcodebuild -scheme QonversionSandwich \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipPackagePluginValidation -skipMacroValidation \
            build CODE_SIGNING_ALLOWED=NO -quiet
