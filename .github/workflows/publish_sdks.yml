name: Publish SDKs

on:
  release:
    types: [released]

jobs:
  android_publish:
    name: Publish Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      # No explicit ref: on the release event the default ref is the release
      # tag, so the published artifacts always match the released commit even
      # if main has moved forward since the release was published.
      - name: Check out code
        uses: actions/checkout@v2

      - name: Prepare Sonatype Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.SONATYPE_GPG_FILE }}" > key.gpg.asc
          gpg -d --passphrase "${{ secrets.SONATYPE_GPG_PASSPHRASE }}" --batch "key.gpg.asc" > "$HOME/.gradle/key.gpg"
          echo "signing.keyId=${{ secrets.SONATYPE_GPG_ID }}" >> ~/.gradle/gradle.properties
          echo "signing.password=${{ secrets.SONATYPE_GPG_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "signing.secretKeyRingFile=$HOME/.gradle/key.gpg" >> ~/.gradle/gradle.properties
          echo "mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}" >> ~/.gradle/gradle.properties
          echo "mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}" >> ~/.gradle/gradle.properties

      - name: Publish to MavenCentral
        run: ./gradlew :sandwich:publishAndReleaseToMavenCentral

  iOS_publish:
    name: Publish iOS release
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check out code
        uses: actions/checkout@v2

      # Idempotent push: trunk regularly answers 500 / "GitHub commit API timed out" AFTER the spec has landed,
      # and a retry then fails with "duplicate entry". The trunk API is the source of truth (the CDN lags).
      - name: CocoaPods Release
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          POD: QonversionSandwich
          SPEC: QonversionSandwich.podspec
        run: |
          version=$(grep -oE "s.version\s*=\s*'[0-9.]+'" "$SPEC" | grep -oE "'[0-9.]+'" | tr -d "'")
          on_trunk() {
            curl -sf "https://trunk.cocoapods.org/api/v1/pods/$POD" \
              | jq -e --arg v "$version" '.versions[] | select(.name == $v)' >/dev/null
          }
          if on_trunk; then
            echo "$POD $version is already on trunk — nothing to push"
            exit 0
          fi
          if pod trunk push "$SPEC" --allow-warnings; then
            exit 0
          fi
          echo "pod trunk push failed — re-checking trunk, the push often lands despite the error"
          sleep 60
          if on_trunk; then
            echo "$POD $version is on trunk — treating the push as successful"
            exit 0
          fi
          echo "::error::$POD $version is not on trunk after the push"
          exit 1
